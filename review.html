<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Review your Nivara order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="review.css" />
</head>
<body>
  <main class="review-shell">
    <a class="review-brand" href="/">NIVARA JEWELLERY</a>
    <section class="review-card">
      <p class="eyebrow">Delivered with love</p>
      <h1>How did you like your jewellery?</h1>
      <p id="reviewIntro" class="review-intro">Tell us what you loved. Your feedback helps other Nivara customers choose with confidence.</p>
      <div id="reviewMessage" class="review-message" aria-live="polite"></div>
      <div id="reviewProducts" class="review-products"></div>
      <a class="back-link" href="/">Back to Nivara Jewellery</a>
    </section>
  </main>
  <script src="review.js"></script>
</body>
</html>
